apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: org-ecommerce-prod
  labels:
    app.kubernetes.io/name: order-api
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: backend
    tier: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
      - name: order-api-container
        image: ghcr.io/acme-org/order-service:v2.4.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http-port
          protocol: TCP
        
        # Enforce strict Pod security context admission rules
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        # Clear CPU & Memory boundaries to prevent cluster resource starvation
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi

        # Mount secrets and config maps from cluster
        envFrom:
        - secretRef:
            name: order-db-secret
        - configMapRef:
            name: order-config-map

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
