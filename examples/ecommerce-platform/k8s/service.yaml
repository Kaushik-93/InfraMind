apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: org-ecommerce-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: loadbalancer
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: order-api
